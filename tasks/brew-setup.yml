- name: Homebrew setup
  tags: brew
  block:
    - name: Check if Homebrew is already installed
      stat:
        path: /home/linuxbrew/.linuxbrew/bin/brew
      register: brew_check

    - name: Install Homebrew
      when: not brew_check.stat.exists
      block:
        - name: Install required dependencies
          become: true
          apt:
            name:
              - curl
              - file
              - git
              - procps
              - build-essential
            state: present

        - name: Download Homebrew installer
          become: true
          get_url:
            url: https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh
            dest: /tmp/homebrew_installer.sh
            mode: '0755'

        - name: Run Homebrew installer
          shell: |
            NONINTERACTIVE=1 /bin/bash /tmp/homebrew_installer.sh
          args:
            creates: "/home/linuxbrew/.linuxbrew/bin/brew"

        - name: Clean up installer
          become: true
          file:
            path: /tmp/homebrew_installer.sh
            state: absent

        - name: Test Homebrew installation
          command: "/home/linuxbrew/.linuxbrew/bin/brew --version"
          register: brew_version
          changed_when: false

        - name: Display Homebrew version
          debug:
            var: brew_version.stdout

    - name: Install packages with Homebrew
      vars:
        homebrew_packages:
          - syncthing
          - lazygit
          - fastfetch
          - nvim
          - direnv
          - just
          - opencode
      block:
        - name: Install brew packages
          environment:
            PATH: "/home/linuxbrew/.linuxbrew/bin:{{ ansible_env.PATH }}"
          community.general.homebrew:
            name: "{{ homebrew_packages }}"
            state: present

    - name: Configure Homebrew and direnv for Bash
      blockinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        create: true
        mode: '0644'
        marker: "# {mark} ANSIBLE MANAGED DEVELOPMENT TOOLS"
        block: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          export PATH="$HOME/.local/bin:$PATH"
          eval "$(direnv hook bash)"
